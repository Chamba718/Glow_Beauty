services:
  - type: web
    name: glow-beauty
    env: python
    buildCommand: bash build.sh
    startCommand: gunicorn glow_beauty.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ""
      - key: DATABASE_URL
        fromDatabase:
          name: glow-beauty-db
          property: connectionString
databases:
  - name: glow-beauty-db
    plan: free
    databaseName: glowbeauty
    user: glowbeauty
